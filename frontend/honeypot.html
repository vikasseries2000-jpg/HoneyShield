<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HoneyShield Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0b0f19;
            color: #e5e7eb;
            font-family: 'Segoe UI', monospace;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .btn-custom {
            background-color: #00d2ff;
            color: #0b0f19;
            border: none;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .btn-custom:hover {
            background-color: #00b8e6;
            color: #0b0f19;
        }
        .form-control {
            background-color: #050811;
            border: 1px solid #1f2937;
            color: #00d2ff;
            font-family: monospace;
        }
        .form-control:focus {
            background-color: #050811;
            border-color: #00d2ff;
            color: #00d2ff;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
        }
        .alert-custom {
            font-size: 0.85rem;
            display: none;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="text-center mb-4">
            <h4 class="fw-bold text-info">🛡️ HoneyShield Portal</h4>
            <small class="text-secondary" style="font-size: 0.75rem; letter-spacing: 1px;">RESTRICTED ACCESS ■ AUTHORIZED PERSONNEL ONLY</small>
        </div>

        <form id="loginForm">
            <input type="hidden" id="canaryToken" name="canaryToken" value="HONEY_TOKEN_9923">

            <div class="mb-3">
                <label class="form-label text-secondary fs-7">IDENTITY / USERNAME</label>
                <!-- SQLi Payload Placeholder -->
                <input type="text" class="form-control" id="username" required placeholder="' OR '1'='1">
            </div>

            <div class="mb-3">
                <label class="form-label text-secondary fs-7">SECURITY PASSWORD</label>
                <input type="password" class="form-control" id="password" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn btn-custom w-100 py-2 mt-2">Authenticate</button>
        </form>

        <div id="responseAlert" class="alert mt-3 alert-custom" role="alert"></div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const canaryToken = document.getElementById('canaryToken').value;
            const alertBox = document.getElementById('responseAlert');

            alertBox.style.display = 'none';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, canaryToken })
                });

                const data = await response.json();

                if (response.ok) {
                    if (data.status === "DECEPTIVE_REDIRECT") {
                        // EXACT FIX FOR GREEN MESSAGE & REDIRECT
                        alertBox.className = 'alert alert-success alert-custom d-block';
                        alertBox.innerHTML = `✅ <b>AUTHENTICATION SUCCESSFUL</b><br>Redirecting to Enterprise Secure Admin Console...`;
                        
                        // Wait 1.5 seconds so attacker reads it, then BAM! Redirect.
                        setTimeout(() => {
                            window.location.href = '/clown.html';
                        }, 1500);
                        
                    } else {
                        alertBox.className = 'alert alert-success alert-custom d-block';
                        alertBox.innerHTML = `✅ Authenticated via Gateway Node: <code>${data.assignedNodeIP}</code>`;
                    }
                } else if (response.status === 403) {
                    alertBox.className = 'alert alert-danger alert-custom d-block';
                    alertBox.innerHTML = `🚫 <b>ACCESS DENIED</b><br>Blacklisted on Virtual Sinkhole: <code>${data.virtualSinkholeIP}</code>`;
                } else {
                    alertBox.className = 'alert alert-danger alert-custom d-block';
                    alertBox.innerHTML = `❌ Invalid Credentials on Gateway: <code>${data.gatewayNode || '10.0.0.1'}</code>`;
                }

            } catch (err) {
                console.error("Fetch failure:", err);
                alertBox.className = 'alert alert-danger alert-custom d-block';
                alertBox.innerText = 'Server connection failure: Check if server is running on port 5000.';
            }
        });
    </script>

</body>
</html>
