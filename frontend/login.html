<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HoneyShield - Login Portal</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-card { background: #1e293b; border: 1px solid #334155; padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .login-card h2 { color: #38bdf8; font-size: 22px; margin-bottom: 20px; text-align: center; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; color: #94a3b8; font-size: 13px; margin-bottom: 5px; }
    .form-group input { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; font-size: 14px; outline: none; }
    .form-group input:focus { border-color: #38bdf8; }
    .btn-login { width: 100%; padding: 10px; background: #38bdf8; color: #0f172a; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 15px; margin-top: 10px; }
    .status-msg { margin-top: 15px; padding: 10px; border-radius: 6px; font-size: 13px; display: none; text-align: center; font-weight: bold; }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>🛡️ HoneyShield Portal</h2>
    
    <div id="status-message" class="status-msg"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter username" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" required>
      </div>
      <button type="submit" class="btn-login">Login to Dashboard</button>
    </form>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
