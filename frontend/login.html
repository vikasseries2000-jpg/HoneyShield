<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HoneyShield - Login Portal</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family:
                'Segoe UI',
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;
        }

        body {

            background: #0f172a;

            color: #f8fafc;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;
        }

        .login-card {

            background: #1e293b;

            border: 1px solid #334155;

            padding: 30px;

            border-radius: 12px;

            width: 100%;

            max-width: 400px;

            box-shadow:
                0 10px 25px
                rgba(0, 0, 0, 0.5);
        }

        .login-card h2 {

            color: #38bdf8;

            font-size: 22px;

            margin-bottom: 20px;

            text-align: center;
        }

        .form-group {

            margin-bottom: 15px;
        }

        .form-group label {

            display: block;

            color: #94a3b8;

            font-size: 13px;

            margin-bottom: 5px;
        }

        .form-group input {

            width: 100%;

            padding: 11px;

            background: #0f172a;

            border: 1px solid #334155;

            border-radius: 6px;

            color: white;

            font-size: 14px;

            outline: none;
        }

        .form-group input:focus {

            border-color: #38bdf8;
        }

        .btn-login {

            width: 100%;

            padding: 11px;

            background: #38bdf8;

            color: #0f172a;

            border: none;

            border-radius: 6px;

            font-weight: bold;

            cursor: pointer;

            font-size: 15px;

            margin-top: 10px;
        }

        .btn-login:hover {

            background: #0ea5e9;
        }

        .btn-login:disabled {

            opacity: 0.6;

            cursor: not-allowed;
        }

        #status-message {

            display: none;

            margin-bottom: 15px;

            padding: 10px;

            border-radius: 6px;

            font-size: 13px;

            text-align: center;

            font-weight: bold;
        }

    </style>

</head>


<body>

    <div class="login-card">

        <h2>🛡️ HoneyShield Portal</h2>

        <div id="status-message"></div>


        <form id="login-form">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                id="login-button"
                class="btn-login">

                Login to Dashboard

            </button>

        </form>

    </div>


    <!-- =========================================
         SIMPLE LOGIN SYSTEM
         No Supabase
         No app.js
         ========================================= -->

    <script>

        const loginForm =
            document.getElementById("login-form");

        const usernameInput =
            document.getElementById("username");

        const passwordInput =
            document.getElementById("password");

        const loginButton =
            document.getElementById("login-button");

        const statusMessage =
            document.getElementById("status-message");


        function showMessage(
            message,
            type
        ) {

            statusMessage.style.display =
                "block";

            statusMessage.textContent =
                message;


            if (type === "success") {

                statusMessage.style.background =
                    "#064e3b";

                statusMessage.style.color =
                    "#6ee7b7";

                statusMessage.style.border =
                    "1px solid #10b981";

            }

            else if (type === "warning") {

                statusMessage.style.background =
                    "#713f12";

                statusMessage.style.color =
                    "#fef08a";

                statusMessage.style.border =
                    "1px solid #f59e0b";

            }

            else if (type === "blocked") {

                statusMessage.style.background =
                    "#7f1d1d";

                statusMessage.style.color =
                    "#fca5a5";

                statusMessage.style.border =
                    "1px solid #ef4444";

            }

            else {

                statusMessage.style.background =
                    "#334155";

                statusMessage.style.color =
                    "#f8fafc";

                statusMessage.style.border =
                    "1px solid #64748b";
            }
        }


        loginForm.addEventListener(
            "submit",
            async function(event) {

                // MOST IMPORTANT LINE
                event.preventDefault();


                const username =
                    usernameInput.value.trim();

                const password =
                    passwordInput.value;


                if (!username || !password) {

                    showMessage(
                        "Please enter username and password.",
                        "warning"
                    );

                    return;
                }


                loginButton.disabled =
                    true;

                loginButton.textContent =
                    "Checking...";


                try {

                    const response =
                        await fetch(
                            "/api/auth/login",
                            {

                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    username:
                                        username,

                                    password:
                                        password
                                })
                            }
                        );


                    const result =
                        await response.json();


                    console.log(
                        "HoneyShield Response:",
                        result
                    );


                    // =====================================
                    // REAL USER
                    // =====================================

                    if (
                        result.success === true &&
                        result.mode === "REAL"
                    ) {

                        showMessage(
                            "✅ Login successful. Opening dashboard...",
                            "success"
                        );


                        setTimeout(
                            function() {

                                window.location.href =
                                    "/dashboard";

                            },
                            500
                        );


                        return;
                    }


                    // =====================================
                    // ATTACKER
                    // =====================================

                    if (
                        result.mode === "DECOY"
                    ) {

                        showMessage(
                            "🛡️ Threat detected. Redirecting to honeypot...",
                            "blocked"
                        );


                        setTimeout(
                            function() {

                                window.location.href =
                                    "/honeypot";

                            },
                            700
                        );


                        return;
                    }


                    // =====================================
                    // SUSPICIOUS
                    // =====================================

                    if (
                        result.mode === "SUSPICIOUS"
                    ) {

                        showMessage(
                            "⚠️ Suspicious login attempt. Attempts: " +
                            result.attempts,
                            "warning"
                        );


                        return;
                    }


                    // =====================================
                    // WRONG PASSWORD
                    // =====================================

                    showMessage(
                        result.message ||
                        "❌ Invalid username or password.",
                        "warning"
                    );

                }


                catch (error) {

                    console.error(
                        "HoneyShield Login Error:",
                        error
                    );


                    showMessage(
                        "❌ Backend connection failed.",
                        "error"
                    );

                }


                finally {

                    loginButton.disabled =
                        false;

                    loginButton.textContent =
                        "Login to Dashboard";
                }

            }
        );

    </script>

</body>

</html>
